# aqt uses LOG_CFG to override its default checkout-local aqtinstall.log.
# Keep diagnostics in the runner's temporary directory, outside tagged source.
[loggers]
keys=root,aqt
[handlers]
keys=console,file
[formatters]
keys=brief,verbose
[logger_root]
level=NOTSET
handlers=console
[logger_aqt]
level=DEBUG
handlers=console,file
propagate=0
qualname=aqt
[handler_console]
level=INFO
class=logging.StreamHandler
formatter=brief
args=(sys.stderr,)
[handler_file]
level=DEBUG
class=logging.FileHandler
formatter=verbose
args=(os.path.join(os.environ['RUNNER_TEMP'], 'aqtinstall.log'), 'a')
[formatter_brief]
format=%(levelname)-8s: %(message)s
[formatter_verbose]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
