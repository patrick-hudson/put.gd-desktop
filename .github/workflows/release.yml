name: Release
# Every push to main (a promotion from nightly, or a hotfix) cuts the next
# release candidate vBASE-rc.N. Run manually with channel=stable on a candidate
# commit to cut vBASE. Both stage a GitHub draft only; publication stays manual
# after exact-asset acceptance (tools/releases/publish.py --publish --acceptance).
# Nothing here is public, so the put.gd-site notification that nightly.yml
# sends after publishing is not sent from this run (issue #178).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: candidate cuts the next vBASE-rc.N; stable cuts vBASE on a candidate commit
        type: choice
        options: [candidate, stable]
        default: candidate
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the immutable release tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Choose and create the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'candidate' }}
        run: python3 tools/releases/release_tag.py --channel "$CHANNEL" --output "$RUNNER_TEMP/release-tag.json"
      - name: Retain the tag decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tag
          path: ${{ runner.temp }}/release-tag.json
          if-no-files-found: warn
          retention-days: 90

  ci:
    needs: tag
    permissions:
      contents: read
      # ci.yml's prune-caches job declares these; it runs only on nightly pushes.
      actions: write
      pull-requests: read
      # ci.yml's test jobs record flaky tests in tracker issues.
      issues: write
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ needs.tag.outputs.tag }}

  draft:
    needs: [tag, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # stage the draft release
      pull-requests: read  # labels for the release notes' changes section
      issues: read  # the issues each listed pull request closes
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
      CHANNEL: ${{ needs.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: build/publish
      - name: Stage verified GitHub draft
        run: python3 tools/releases/publish.py --tag "$TAG" --directory build/publish
      - name: Summarize next steps
        run: |
          base="${TAG%%-rc.*}"
          {
            echo "Staged draft $CHANNEL release \`$TAG\`: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
            echo
            echo "1. Run exact-asset acceptance on the draft downloads (docs/release.md)."
            echo "2. Publish: \`gh release download $TAG -D build/publish\`, check out \`$TAG\`, then"
            echo "   \`python3 tools/releases/publish.py --tag $TAG --directory build/publish --publish --acceptance RECEIPT\`."
            if [ "$CHANNEL" = candidate ]; then
              echo "3. When this candidate is accepted, run Release with channel=stable to cut \`$base\` on this commit."
            else
              echo "3. Open a pull request into nightly that bumps project(putgd VERSION) past \`${TAG#v}\`."
              echo "   Nightlies stay paused until it merges."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/publish/staging.json
            build/publish/release-notes.md
          if-no-files-found: warn
          retention-days: 90
