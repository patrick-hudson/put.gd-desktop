name: Release
# Every push to main (a promotion from nightly, or a hotfix) tags the stable
# release vYY.MDD.N, main HEAD's UTC commit date and commit count (#373), and
# stages its GitHub draft; a manual run repeats that for main HEAD, reusing its
# tag. Publication stays manual after exact-asset acceptance
# (tools/releases/publish.py --publish --acceptance).
# Nothing here is public, so the put.gd-site notification that nightly.yml
# sends after publishing is not sent from this run (issue #178).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # create the immutable release tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Choose and create the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/releases/release_tag.py --output "$RUNNER_TEMP/release-tag.json"
      - name: Retain the tag decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tag
          path: ${{ runner.temp }}/release-tag.json
          if-no-files-found: warn
          retention-days: 90

  ci:
    needs: tag
    permissions:
      contents: read
      # ci.yml's prune-caches job declares these; it runs only on nightly pushes.
      actions: write
      pull-requests: read
      # ci.yml's test jobs record flaky tests in tracker issues.
      issues: write
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ needs.tag.outputs.tag }}

  draft:
    needs: [tag, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write  # stage the draft release
      pull-requests: read  # labels for the release notes' changes section
      issues: read  # the issues each listed pull request closes
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
      CHANNEL: ${{ needs.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: build/publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source-assets
          path: build/publish/sources
      - name: Stage verified GitHub draft
        run: python3 tools/releases/publish.py --tag "$TAG" --directory build/publish
      - name: Summarize next steps
        run: |
          {
            echo "Staged draft $CHANNEL release \`$TAG\`: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
            echo
            echo "1. Run exact-asset acceptance on the draft downloads (docs/release.md)."
            echo "2. Publish: \`gh release download $TAG -D build/publish\`, check out \`$TAG\`, then"
            echo "   \`python3 tools/releases/publish.py --tag $TAG --directory build/publish --publish --acceptance RECEIPT\`."
            echo "3. Name the CHANGELOG.md section: \`python3 tools/releases/promote.py --finalize $TAG --open\`."
            echo "If acceptance fails, fix it on nightly and promote again: the next merge is a new version."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain staging evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/publish/staging.json
            build/publish/release-notes.md
          if-no-files-found: warn
          retention-days: 90
