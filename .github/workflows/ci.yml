name: CI
# Pull requests run the jobs their changed paths can affect. Pushes to nightly,
# manual runs and stable callers run everything. Nightlies can reuse verified
# source checks at the exact commit. The `CI` job is the single
# required check: it fails when any selected job did not succeed.
on:
  pull_request:
  push:
    branches: [nightly]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Existing exact release tag to test, package and collect
        type: string
        required: true
      reuse_source_ci:
        description: Reuse passing source tests for this exact nightly commit, otherwise run them
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ inputs.release_tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release_tag }}
env:
  # Ubuntu containers name one archive host, so an outage there fails every
  # retry. Rank alternatives by bounded download throughput, including mirrors
  # that answer HTTP 200 but deliver packages too slowly. APT fails over file by
  # file and still verifies everything against the Ubuntu keyring, but it goes
  # back to the first mirror for every file. A mirror can probe fast and then
  # stall on real downloads, so putgd_apt_install bounds each attempt, keeps
  # what it downloaded, and demotes a first mirror that delivered too little.
  PUTGD_UBUNTU_MIRRORS: |
    apt_root=${PUTGD_APT_ROOT:-/etc/apt}
    # security.ubuntu.com too: the mirrors carry the -security pocket, and that
    # host has stalled together with archive.ubuntu.com.
    sources=$(grep -lE 'http://(archive|security)\.ubuntu\.com/ubuntu' "$apt_root"/sources.list "$apt_root"/sources.list.d/* 2>/dev/null || true)
    if [ -n "$sources" ]; then
      probe_dir=$(mktemp -d)
      # Four sequential probes: <= 12.8 s, <= 8 MiB of response bodies.
      # 1 MiB/s fetches 483 MiB in ~8 minutes, within two of the three install attempts.
      floor=1048576
      for endpoint in ${PUTGD_UBUNTU_MIRROR_HOSTS:-us.archive.ubuntu.com mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com}; do
        host=${endpoint%%:*}; port=${endpoint#*:}; [ "$port" != "$endpoint" ] || port=80
        start=$(date +%s%N)
        # Sample a base noble package: cached indexes can be fast while pool
      # downloads crawl. This version remains referenced by noble/main.
      # HTTP/1.0 avoids chunked encoding. Range bounds cooperative servers;
        # head also bounds servers that ignore Range. A partial body at timeout
        # is measured too, so a live trickle cannot pass as a fast mirror.
        timeout --kill-after=0.2s 3s bash -c '
          exec 3<>/dev/tcp/$1/$2 || exit 1
          printf "GET /ubuntu/pool/main/g/glibc/libc6_2.39-0ubuntu8_amd64.deb HTTP/1.0\r\nHost: %s\r\nRange: bytes=0-2097151\r\n\r\n" "$1" >&3
          IFS= read -r status <&3
          case "$status" in *" 200 "*|*" 206 "*) ;; *) exit 1;; esac
          while IFS= read -r line <&3; do [ "$line" != $'"'"'\r'"'"' ] || break; done
          head -c 2097152 <&3 > "$3"
        ' _ "$host" "$port" "$probe_dir/body" 2>/dev/null || true
        elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
        [ "$elapsed" -gt 0 ] || elapsed=1
        bytes=0
        [ ! -f "$probe_dir/body" ] || bytes=$(wc -c < "$probe_dir/body")
        speed=$(( bytes * 1000 / elapsed ))
        tier=2; label=unavailable
        if [ "$speed" -ge "$floor" ]; then tier=0; label=fast
        elif [ "$speed" -gt 0 ]; then tier=1; label=below-floor; fi
        echo "Ubuntu mirror throughput: $endpoint $speed B/s ($bytes bytes in $elapsed ms; $label; floor=$floor B/s)"
        printf '%d %d %s\n' "$tier" "$speed" "$endpoint" >> "$probe_dir/rank"
        rm -f "$probe_dir/body"
      done
      priority=0
      : > "$apt_root/putgd-mirrors.txt"
      while read -r tier speed endpoint; do
        priority=$((priority + 1))
        printf 'http://%s/ubuntu/\tpriority:%d\n' "$endpoint" "$priority" >> "$apt_root/putgd-mirrors.txt"
      done < <(LC_ALL=C sort -s -k1,1n -k2,2nr "$probe_dir/rank")
      awk '$1 < 2' "$probe_dir/rank" | wc -l > "$apt_root/putgd-mirrors.txt.usable"
      rm -f "$probe_dir/rank"
      rmdir "$probe_dir"
      sed -i -E "s#http://(archive|security)\.ubuntu\.com/ubuntu/?#mirror+file:$apt_root/putgd-mirrors.txt#" $sources
    fi
    # Move the first mirror behind the others that answered the probe. Mirrors
    # that gave nothing stay last: rotating one to the front costs 40 s a file.
    putgd_demote_mirror() {
      local list=${PUTGD_APT_ROOT:-/etc/apt}/putgd-mirrors.txt usable first
      [ -s "$list" ] || return 0
      usable=$(cat "$list.usable" 2>/dev/null || true)
      [ "${usable:-0}" -gt 0 ] || usable=$(wc -l < "$list")
      [ "$usable" -gt 1 ] || return 0
      first=$(head -n 1 "$list" | cut -f1)
      cut -f1 "$list" | awk -v n="$usable" 'NR == 1 { first = $0; next } { print } NR == n { print first }' |
        awk '{ printf "%s\tpriority:%d\n", $0, NR }' > "$list.new"
      mv "$list.new" "$list"
      echo "Ubuntu mirror moved behind the other usable mirrors: $first"
    }
    # putgd_apt_install [OPTION|PACKAGE]...: apt-get update and install with the
    # caller's apt=() options, in three attempts of at most 6 minutes each.
    # Downloads go to their own directory: Docker images delete apt's default
    # archives after every update, which would discard a stopped attempt's
    # progress. An attempt that fetched under 128 MiB demotes its first mirror.
    putgd_apt_install() {
      local attempt limit=${PUTGD_APT_ATTEMPT_SECONDS:-360} deadline left updated= before fetched
      local archives=${PUTGD_APT_ARCHIVES:-/var/cache/putgd-apt}
      mkdir -p "$archives/partial"
      for attempt in 1 2 3; do
        deadline=$((SECONDS + limit))
        before=$(du -sk "$archives" | cut -f1)
        if [ -n "$updated" ] || timeout --kill-after=30s "$limit" apt-get update --error-on=any "${apt[@]}"; then
          updated=1
          left=$((deadline - SECONDS)); [ "$left" -gt 0 ] || left=1
          if DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s "$left" apt-get install -y "${apt[@]}" -o "Dir::Cache::Archives=$archives/" "$@"; then
            apt-get clean -o "Dir::Cache::Archives=$archives/" || true
            return 0
          fi
        fi
        fetched=$(( $(du -sk "$archives" | cut -f1) - before ))
        echo "::warning::Package install: attempt $attempt of 3 failed or ran over $limit s after fetching $((fetched / 1024)) MiB"
        [ "$attempt" != 3 ] || break
        [ "$fetched" -ge "${PUTGD_APT_PROGRESS_KB:-131072}" ] || putgd_demote_mirror
        # A stopped attempt can leave dpkg half done; apt-get refuses to install until it is finished.
        timeout --kill-after=30s 120 dpkg --configure -a || true
      done
      return 1
    }

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.select.outputs.build }}
      catalog: ${{ steps.select.outputs.catalog }}
      packages: ${{ steps.select.outputs.packages }}
      sanitizers: ${{ steps.select.outputs.sanitizers }}
      pipewire: ${{ steps.select.outputs.pipewire }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Select jobs from changed paths
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/changes.py ${{ inputs.reuse_source_ci && '--reuse-source-ci' || '' }}
      - name: Retain exact source CI provenance
        if: inputs.reuse_source_ci
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-ci-provenance
          path: build/reused-ci.json
          if-no-files-found: error
          retention-days: 90

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every branch and tag: the secret scan below reads
          # them all, since a fork receives every public ref.
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Install QEMU disk utilities and dwz for the contracts
        env:
          PUTGD_PKG_LABEL: contracts
        run: sudo --preserve-env=GITHUB_STEP_SUMMARY,PUTGD_PKG_LABEL bash tools/ci/install-packages.sh --no-install-recommends qemu-utils dwz python3-dbus python3-pil python3-pytest tesseract-ocr
      - name: Release, packaging and CI tool contracts
        if: always()
        run: python3 tools/ci/contracts.py release
      - name: Proton helper source contracts
        if: always()
        run: python3 tools/ci/contracts.py proton
      - name: Lab identity and storage safety contracts
        if: always()
        run: python3 tools/ci/contracts.py lab
      - name: Surface driver, map, fixture, redact and recipe contracts
        if: always()
        timeout-minutes: 3
        run: python3 -m pytest -v tests/desktop/test_surface*.py tests/desktop/test_review_adversarial.py --junitxml=build/contracts/surface-tests.xml
      - name: Cold-family observer contracts
        if: always()
        run: python3 tools/ci/contracts.py observer
      - name: Replay saved live-S3 numeric evidence
        if: always()
        run: python3 tools/ci/contracts.py evidence
      - name: Lint workflows
        if: always()
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          python3 tools/releases/http_retry.py https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=
      - name: Scan every branch and tag for leaked secrets
        # Scoped exceptions live in .gitleaks.toml. Only sanitized SARIF enters
        # the artifact directory, even when a finding fails the scan.
        if: always()
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          python3 tools/releases/http_retry.py https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" python3 -m unittest discover -s tests/ci -p test_gitleaks.py -v
          mkdir -p build/contracts
          report_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-report.XXXXXX")
          trap 'rm -rf "$report_dir"' EXIT
          status=0
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts=--all --redact --no-banner \
            --exit-code 1 --report-format sarif --report-path "$report_dir/raw.sarif" || status=$?
          # A sanitizer failure must not hide the scanner's own result.
          sanitized=0
          python3 tools/ci/sanitize_gitleaks_sarif.py "$report_dir/raw.sarif" build/contracts/gitleaks.sarif || sanitized=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$sanitized"
      - name: Preserve contract reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts
          path: build/contracts/
          if-no-files-found: warn
          retention-days: 30

  linux:
    name: linux (${{ matrix.distribution }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    # Normally 5-10 minutes (#467).
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write  # the flaky-test tracker (tools/ci/flake_ledger.py)
    container: ubuntu:${{ matrix.distribution }}
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    strategy:
      fail-fast: false
      matrix:
        distribution: ['24.04', '26.04']
    steps:
      - name: Install distro dependencies
        # Three bounded attempts that keep their downloads; a mirror that delivers too little is demoted (#467).
        timeout-minutes: 30
        shell: bash
        run: |
          apt=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          eval "$PUTGD_UBUNTU_MIRRORS"
          packages=(build-essential ccache git ca-certificates passwd util-linux qemu-utils python3 nodejs npm cmake ninja-build pkg-config libtesseract-dev libleptonica-dev libzxing-dev tesseract-ocr-eng qt6-base-dev qt6-svg-dev qt6-base-dev-tools libqt6sql6-sqlite qt6-wayland-dev qtkeychain-qt6-dev libxcb1-dev libxcb-keysyms1-dev libxcb-util-dev libxcb-image0-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-damage0-dev libxcb-shape0-dev libxcb-xinput-dev libxcb-xtest0-dev xvfb xauth dbus-daemon libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libwayland-dev wayland-protocols libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev libswscale-dev libswresample-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-pipewire gstreamer1.0-libav)
          if [ '${{ matrix.distribution }}' = '26.04' ]; then
            # faketime pins the UI catalog clock; Pillow and numpy support shared image-diff tests.
            packages+=(liblayershellqtinterface-dev faketime python3-pil python3-numpy)
            # budgie_labwc_integration runs the Budgie adapter against a real headless labwc (#1275).
            packages+=(labwc wl-clipboard wlr-randr)
          fi
          putgd_apt_install "${packages[@]}"
          useradd --create-home --shell /bin/bash putgd-ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Trust container checkout for build identity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/build/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
      - name: Identify exact dependency cache environment
        id: sdk-key
        run: python3 tools/ci/sdk_cache.py key --contract tools/ci/provision-linux-sdk.sh
      - name: Restore verified dependency prefix
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/sdk
            build/sdk-cache.json
          key: ${{ steps.sdk-key.outputs.key }}
      - name: Verify restored dependency prefix
        if: steps.sdk-cache.outputs.cache-hit == 'true'
        run: python3 tools/ci/sdk_cache.py verify --key '${{ steps.sdk-key.outputs.key }}'
      - name: Provision pinned AWS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          PUTGD_SDK_JOBS="$(nproc)" bash tools/ci/provision-linux-sdk.sh
          python3 tools/ci/sdk_cache.py seal --key '${{ steps.sdk-key.outputs.key }}'
      - name: Save verified dependency prefix
        if: steps.sdk-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/sdk
            build/sdk-cache.json
          key: ${{ steps.sdk-key.outputs.key }}
      - name: Provision pinned Proton helper
        timeout-minutes: 15
        run: python3 tools/proton/provision_runtime.py
      - name: Reproduce the exact compiled Proton helper
        run: python3 tools/proton/audit_redistribution.py --runtime build/dependencies/proton-runtime --output build/proton-rebuild-audit
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ccache-linux-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-${{ matrix.distribution }}-
      - name: Build
        id: build
        run: |
          echo "CCACHE_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          ccache --zero-stats
          # Render selected PR inputs and every full run for nightly consumers.
          cmake --preset dev -DPUTGD_BUNDLE_PROTON=ON -DPUTGD_TEST_TIMEOUT_SCALE=3 \
            -DPUTGD_UI_CATALOG_RENDER=${{ matrix.distribution == '26.04' && needs.changes.outputs.catalog == 'true' && 'ON' || 'OFF' }} \
            -DPUTGD_AWS_SOURCE_DIR="$PWD/build/sdk/share/putgd-ci/aws-sdk-source-licenses" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset dev --parallel "$(nproc)"
          ccache --show-stats
      - name: Keep only this build's compiler cache entries
        # Entries this build neither hit nor stored would only grow the saved cache.
        run: |
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_BUILD_START + 60 ))s"
          ccache --show-stats
      - name: Save compiler cache
        # Only nightly pushes save; pull requests and other runs restore the newest
        # nightly cache. The prune-caches job deletes the entry this one supersedes.
        if: github.event_name == 'push' && github.ref == 'refs/heads/nightly'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ccache-linux-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore test durations
        # With earlier durations, CTest starts the longest tests first.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dev/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-linux-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ctest-cost-linux-${{ matrix.distribution }}-
      - name: Test
        # Wait budgets scale with PUTGD_TEST_TIME_SCALE (tests/fixtures/Waits.h).
        # A failed integration test is retried once and reported; unit tests never are.
        # Tests labelled `nightly` (gui_theme_contrast) run on pushes, not pull requests.
        env:
          PUTGD_TEST_TIME_SCALE: '3'
          PUTGD_CI_JOB: linux (${{ matrix.distribution }})
          PUTGD_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUTGD_CTEST_EXCLUDE: ${{ github.event_name == 'pull_request' && '^nightly$' || '' }}
        run: |
          test_tmp="$(mktemp -d /tmp/pgci.XXXXXX)"
          python3 tools/ci/ctest_preflight.py --build build/dev --tmp "$test_tmp" --user putgd-ci
          chown -R putgd-ci:putgd-ci build/dev "$test_tmp"
          runuser -u putgd-ci -- sh -ec 'id -u > build/dev/ctest-observed-uid; exec env TMPDIR="$1" python3 tools/ci/ctest_retry.py --ledger build/dev/flake-ledger.json --junit "$2" -- --preset dev --parallel 12 --resource-spec-file "$3" ${4:+--label-exclude "$4"}' _ "$test_tmp" "$PWD/build/dev/ctest-results.xml" "$PWD/tools/ci/ctest-resources.json" "$PUTGD_CTEST_EXCLUDE"
      - name: Report flaky tests
        # Every test that passed only on its retry is listed in the job summary
        # and recorded in its `flaky-test` tracker issue.
        if: always() && hashFiles('build/dev/flake-ledger.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/flake_ledger.py summary build/dev/flake-ledger.json --title 'linux (${{ matrix.distribution }}): flaky and failed tests' --output "$GITHUB_STEP_SUMMARY"
          python3 tools/ci/flake_ledger.py issues build/dev/flake-ledger.json
      - name: Save test durations
        # Failed runs save too: CTest records failures and starts them first next time.
        if: always() && hashFiles('build/dev/Testing/Temporary/CTestCostData.txt') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dev/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-linux-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check the surface map against the UI catalog
        # ui_catalog_render rendered every window, menu, editor, review and overlay
        # state offscreen, with each capture's controls and key bindings
        # (tools/lab/surface_map). The nightly workflow publishes the map
        # rendered from this artifact to map.put.gd.
        if: matrix.distribution == '26.04' && needs.changes.outputs.catalog == 'true'
        run: |
          python3 tools/lab/surface_map/surface_map.py check --catalog build/dev/ui-catalog/dark
          # The surface driver's live gate admits only catalogs whose secret-control
          # states equal this pin; a UI change must update it in the same commit.
          python3 -m tools.lab.surface_driver.gate check-catalog build/dev/ui-catalog/dark
      - name: Preserve the UI catalog
        if: matrix.distribution == '26.04' && needs.changes.outputs.catalog == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-catalog
          path: build/dev/ui-catalog/dark
          if-no-files-found: error
          # As long as source-ci-provenance: a nightly that reuses this run reads it.
          retention-days: 90
      - name: Preserve structured test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-linux-${{ matrix.distribution }}
          path: |
            build/dev/ctest-results.xml
            build/dev/ctest-results-retry.xml
            build/dev/flake-ledger.json
            build/dev/registered-tests.json
            build/dev/socket-preflight.json
            build/dev/ci-test-context.json
            build/dev/ctest-observed-uid
            build/dev/Testing/Temporary/LastTest.log
            build/dev/Testing/Temporary/LastTestsFailed.log
            build/dev/build-identity/build-info.json
            build/proton-rebuild-audit/inventory.json
            build/proton-rebuild-audit/compile.txt
            build/ci-sdk-environment.json
            build/sdk-cache.json
          if-no-files-found: warn
          retention-days: 30

  sanitizers:
    # Not in the required `CI` summary until it has proven stable (#90).
    name: sanitizers (clang ASan/UBSan)
    needs: changes
    if: needs.changes.outputs.sanitizers == 'true'
    permissions:
      contents: read
      issues: write  # the flaky-test tracker (tools/ci/flake_ledger.py)
    runs-on: ubuntu-24.04
    # Normally 5-10 minutes, more when the instrumented QtCore is rebuilt (#467).
    timeout-minutes: 90
    container: ubuntu:26.04
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Install distro dependencies
        # Three bounded attempts that keep their downloads; a mirror that delivers too little is demoted (#467).
        timeout-minutes: 30
        shell: bash
        run: |
          apt=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          eval "$PUTGD_UBUNTU_MIRRORS"
          putgd_apt_install build-essential clang libclang-rt-dev llvm ccache git ca-certificates curl passwd util-linux python3 cmake ninja-build pkg-config libtesseract-dev libleptonica-dev libzxing-dev tesseract-ocr-eng qt6-base-dev qt6-svg-dev qt6-base-dev-tools libqt6sql6-sqlite qt6-wayland-dev qtkeychain-qt6-dev liblayershellqtinterface-dev libxcb1-dev libxcb-keysyms1-dev libxcb-util-dev libxcb-image0-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-damage0-dev libxcb-shape0-dev libxcb-xinput-dev libxcb-xtest0-dev xvfb xauth dbus-daemon libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libwayland-dev wayland-protocols libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev libswscale-dev libswresample-dev
          useradd --create-home --shell /bin/bash putgd-ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Trust container checkout for build identity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/build/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=400M" >> "$GITHUB_ENV"
      - name: Identify exact dependency cache environment
        id: sdk-key
        run: python3 tools/ci/sdk_cache.py key --contract tools/ci/provision-linux-sdk.sh
      - name: Restore verified dependency prefix
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/sdk
            build/sdk-cache.json
          key: ${{ steps.sdk-key.outputs.key }}
      - name: Verify restored dependency prefix
        if: steps.sdk-cache.outputs.cache-hit == 'true'
        run: python3 tools/ci/sdk_cache.py verify --key '${{ steps.sdk-key.outputs.key }}'
      - name: Provision pinned AWS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          PUTGD_SDK_JOBS="$(nproc)" bash tools/ci/provision-linux-sdk.sh
          python3 tools/ci/sdk_cache.py seal --key '${{ steps.sdk-key.outputs.key }}'
      - name: Save verified dependency prefix
        if: steps.sdk-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/sdk
            build/sdk-cache.json
          key: ${{ steps.sdk-key.outputs.key }}
      - name: Identify instrumented QtCore
        id: qt-key
        run: |
          # The distro Qt version is part of the key: a new distro Qt misses the
          # cache, and the recipe then fails unless its pinned version matches.
          qt="$(dpkg-query -W -f '${Version}' libqt6core6t64)"
          clang="$(clang++ -dumpversion)"
          recipe="$(sha256sum tools/ci/provision-qt-asan.sh | cut -c1-16)"
          echo "key=qt-asan-core-26.04-qt$qt-clang$clang-$recipe" >> "$GITHUB_OUTPUT"
      - name: Restore instrumented QtCore
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/qt-asan
          key: ${{ steps.qt-key.outputs.key }}
      - name: Build instrumented QtCore
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: bash tools/ci/provision-qt-asan.sh build/qt-asan
      - name: Save instrumented QtCore
        if: steps.qt-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/qt-asan
          key: ${{ steps.qt-key.outputs.key }}
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ccache-clang-asan-26.04-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-clang-asan-26.04-
      - name: Build
        id: build
        run: |
          echo "CCACHE_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          ccache --zero-stats
          cmake --preset clang-asan -DPUTGD_TEST_TIMEOUT_SCALE=5 \
            -DPUTGD_AWS_SOURCE_DIR="$PWD/build/sdk/share/putgd-ci/aws-sdk-source-licenses" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset clang-asan --parallel "$(nproc)"
          ccache --show-stats
      - name: Keep only this build's compiler cache entries
        # Entries this build neither hit nor stored would only grow the saved cache.
        run: |
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_BUILD_START + 60 ))s"
          ccache --show-stats
      - name: Save compiler cache
        # Only nightly pushes save; pull requests and other runs restore the newest
        # nightly cache. The prune-caches job deletes the entry this one supersedes.
        if: github.event_name == 'push' && github.ref == 'refs/heads/nightly'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ccache-clang-asan-26.04-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test core contracts under ASan/UBSan
        # The test preset selects the core contracts and short unit tests and
        # makes every ASan or UBSan report fatal. Instrumented code runs about
        # three times slower, so wait budgets scale further than in linux.
        env:
          PUTGD_TEST_TIME_SCALE: '5'
          PUTGD_CI_JOB: sanitizers (clang ASan/UBSan)
          PUTGD_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test_tmp="$(mktemp -d /tmp/pgci.XXXXXX)"
          python3 tools/ci/ctest_preflight.py --build build/clang-asan --tmp "$test_tmp" --user putgd-ci
          chown -R putgd-ci:putgd-ci build/clang-asan "$test_tmp"
          runuser -u putgd-ci -- sh -ec 'exec env TMPDIR="$1" LD_LIBRARY_PATH="$PWD/build/qt-asan/lib" ASAN_SYMBOLIZER_PATH="$(command -v llvm-symbolizer)" python3 tools/ci/ctest_retry.py --ledger build/clang-asan/flake-ledger.json --junit "$2" -- --preset clang-asan --parallel 4' _ "$test_tmp" "$PWD/build/clang-asan/ctest-results.xml"
      - name: Report flaky tests
        if: always() && hashFiles('build/clang-asan/flake-ledger.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/flake_ledger.py summary build/clang-asan/flake-ledger.json --title 'sanitizers: flaky and failed tests' --output "$GITHUB_STEP_SUMMARY"
          python3 tools/ci/flake_ledger.py issues build/clang-asan/flake-ledger.json
      - name: Preserve structured test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-clang-asan
          path: |
            build/clang-asan/ctest-results.xml
            build/clang-asan/ctest-results-retry.xml
            build/clang-asan/flake-ledger.json
            build/clang-asan/registered-tests.json
            build/clang-asan/Testing/Temporary/LastTest.log
            build/clang-asan/Testing/Temporary/LastTestsFailed.log
            build/clang-asan/build-identity/build-info.json
            build/qt-asan/BUILD
          if-no-files-found: warn
          retention-days: 30

  caches:
    # Deletes the caches this push superseded and those of closed pull requests and
    # deleted branches (docs/release/ci.md, "Cache budget"). Not part of the `CI` summary.
    name: prune caches
    needs: [linux, sanitizers]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/nightly' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write  # delete caches
      contents: read
      pull-requests: read  # list open pull requests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/cache_prune.py --repo "$GITHUB_REPOSITORY"

  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    uses: ./.github/workflows/package.yml
    with:
      release_tag: ${{ inputs.release_tag || '' }}

  pipewire:
    # Package runs test their own image immediately after assembly. Only
    # recorder/check-only PRs need the last published image here.
    needs: [changes, packages]
    if: ${{ always() && needs.changes.outputs.pipewire == 'true' && needs.packages.result == 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - name: The latest nightly's AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '[.[] | select(.draft == false and (.tag_name | test("-nightly($|[.])")))][0].tag_name')
          echo "Nightly $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir build/pipewire --pattern '*-x86_64.AppImage' --pattern SHA256SUMS
          (cd build/pipewire && grep -- '-x86_64[.]AppImage$' SHA256SUMS | sha256sum --check --strict)
      - name: Extract the AppImage
        run: |
          image=$(find "$PWD/build/pipewire" -maxdepth 1 -name '*-x86_64.AppImage' | head -n 1)
          test -n "$image"
          chmod +x "$image"
          (cd build/pipewire && "$image" --appimage-extract > /dev/null)
      - name: Link pipewiresrc on Ubuntu 26.04's PipeWire
        run: |
          docker run --rm --env PUTGD_UBUNTU_MIRRORS --volume "$PWD:/src:ro" --workdir /src \
            ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7 \
            bash tests/desktop/pipewire/ci_check.sh --install build/pipewire/squashfs-root

  ci:
    name: CI
    if: always()
    needs: [changes, contracts, linux, packages, pipewire]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          selected = needs['changes'].get('outputs', {})
          expected = {'changes': 'success', 'contracts': 'success',
                      'linux': 'success' if selected.get('build') == 'true' else 'skipped',
                      'packages': 'success' if selected.get('packages') == 'true' else 'skipped',
                      'pipewire': 'success' if selected.get('pipewire') == 'true' and selected.get('packages') != 'true' else 'skipped'}
          failed = False
          for job, want in expected.items():
              got = needs[job]['result']
              print(f'{job:10} {got:10} (required: {want})')
              failed |= got != want
          sys.exit(1 if failed else 0)
          PY
