name: Packages
# Called by CI. Builds and audits the native packages and AppImage. With a
# release tag, the builds carry that exact identity and `collect` assembles the
# verified public asset set as the `release-assets` artifact.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing exact release tag; empty builds development-identity packages
        type: string
        default: ''
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  CCACHE_DIR: ${{ github.workspace }}/build/ccache-package
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 256M
  # Ubuntu containers name one archive host, so an outage there fails every
  # retry. Rank alternatives by bounded download throughput, including mirrors
  # that answer HTTP 200 but deliver packages too slowly. APT fails over file by
  # file and still verifies everything against the Ubuntu keyring, but it goes
  # back to the first mirror for every file. A mirror can probe fast and then
  # stall on real downloads, so putgd_apt_install bounds each attempt, keeps
  # what it downloaded, and demotes a first mirror that delivered too little.
  PUTGD_UBUNTU_MIRRORS: |
    apt_root=${PUTGD_APT_ROOT:-/etc/apt}
    # security.ubuntu.com too: the mirrors carry the -security pocket, and that
    # host has stalled together with archive.ubuntu.com.
    sources=$(grep -lE 'http://(archive|security)\.ubuntu\.com/ubuntu' "$apt_root"/sources.list "$apt_root"/sources.list.d/* 2>/dev/null || true)
    if [ -n "$sources" ]; then
      probe_dir=$(mktemp -d)
      # Four sequential probes: <= 12.8 s, <= 8 MiB of response bodies.
      # 1 MiB/s fetches 483 MiB in ~8 minutes, within two of the three install attempts.
      floor=1048576
      for endpoint in ${PUTGD_UBUNTU_MIRROR_HOSTS:-us.archive.ubuntu.com mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com}; do
        host=${endpoint%%:*}; port=${endpoint#*:}; [ "$port" != "$endpoint" ] || port=80
        start=$(date +%s%N)
        # Sample a base noble package: cached indexes can be fast while pool
      # downloads crawl. This version remains referenced by noble/main.
      # HTTP/1.0 avoids chunked encoding. Range bounds cooperative servers;
        # head also bounds servers that ignore Range. A partial body at timeout
        # is measured too, so a live trickle cannot pass as a fast mirror.
        timeout --kill-after=0.2s 3s bash -c '
          exec 3<>/dev/tcp/$1/$2 || exit 1
          printf "GET /ubuntu/pool/main/g/glibc/libc6_2.39-0ubuntu8_amd64.deb HTTP/1.0\r\nHost: %s\r\nRange: bytes=0-2097151\r\n\r\n" "$1" >&3
          IFS= read -r status <&3
          case "$status" in *" 200 "*|*" 206 "*) ;; *) exit 1;; esac
          while IFS= read -r line <&3; do [ "$line" != $'"'"'\r'"'"' ] || break; done
          head -c 2097152 <&3 > "$3"
        ' _ "$host" "$port" "$probe_dir/body" 2>/dev/null || true
        elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
        [ "$elapsed" -gt 0 ] || elapsed=1
        bytes=0
        [ ! -f "$probe_dir/body" ] || bytes=$(wc -c < "$probe_dir/body")
        speed=$(( bytes * 1000 / elapsed ))
        tier=2; label=unavailable
        if [ "$speed" -ge "$floor" ]; then tier=0; label=fast
        elif [ "$speed" -gt 0 ]; then tier=1; label=below-floor; fi
        echo "Ubuntu mirror throughput: $endpoint $speed B/s ($bytes bytes in $elapsed ms; $label; floor=$floor B/s)"
        printf '%d %d %s\n' "$tier" "$speed" "$endpoint" >> "$probe_dir/rank"
        rm -f "$probe_dir/body"
      done
      priority=0
      : > "$apt_root/putgd-mirrors.txt"
      while read -r tier speed endpoint; do
        priority=$((priority + 1))
        printf 'http://%s/ubuntu/\tpriority:%d\n' "$endpoint" "$priority" >> "$apt_root/putgd-mirrors.txt"
      done < <(LC_ALL=C sort -s -k1,1n -k2,2nr "$probe_dir/rank")
      awk '$1 < 2' "$probe_dir/rank" | wc -l > "$apt_root/putgd-mirrors.txt.usable"
      rm -f "$probe_dir/rank"
      rmdir "$probe_dir"
      sed -i -E "s#http://(archive|security)\.ubuntu\.com/ubuntu/?#mirror+file:$apt_root/putgd-mirrors.txt#" $sources
    fi
    # Move the first mirror behind the others that answered the probe. Mirrors
    # that gave nothing stay last: rotating one to the front costs 40 s a file.
    putgd_demote_mirror() {
      local list=${PUTGD_APT_ROOT:-/etc/apt}/putgd-mirrors.txt usable first
      [ -s "$list" ] || return 0
      usable=$(cat "$list.usable" 2>/dev/null || true)
      [ "${usable:-0}" -gt 0 ] || usable=$(wc -l < "$list")
      [ "$usable" -gt 1 ] || return 0
      first=$(head -n 1 "$list" | cut -f1)
      cut -f1 "$list" | awk -v n="$usable" 'NR == 1 { first = $0; next } { print } NR == n { print first }' |
        awk '{ printf "%s\tpriority:%d\n", $0, NR }' > "$list.new"
      mv "$list.new" "$list"
      echo "Ubuntu mirror moved behind the other usable mirrors: $first"
    }
    # putgd_apt_install [OPTION|PACKAGE]...: apt-get update and install with the
    # caller's apt=() options, in three attempts of at most 6 minutes each.
    # Downloads go to their own directory: Docker images delete apt's default
    # archives after every update, which would discard a stopped attempt's
    # progress. An attempt that fetched under 128 MiB demotes its first mirror.
    putgd_apt_install() {
      local attempt limit=${PUTGD_APT_ATTEMPT_SECONDS:-360} deadline left updated= before fetched
      local archives=${PUTGD_APT_ARCHIVES:-/var/cache/putgd-apt}
      mkdir -p "$archives/partial"
      for attempt in 1 2 3; do
        deadline=$((SECONDS + limit))
        before=$(du -sk "$archives" | cut -f1)
        if [ -n "$updated" ] || timeout --kill-after=30s "$limit" apt-get update --error-on=any "${apt[@]}"; then
          updated=1
          left=$((deadline - SECONDS)); [ "$left" -gt 0 ] || left=1
          if DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s "$left" apt-get install -y "${apt[@]}" -o "Dir::Cache::Archives=$archives/" "$@"; then
            apt-get clean -o "Dir::Cache::Archives=$archives/" || true
            return 0
          fi
        fi
        fetched=$(( $(du -sk "$archives" | cut -f1) - before ))
        echo "::warning::Package install: attempt $attempt of 3 failed or ran over $limit s after fetching $((fetched / 1024)) MiB"
        [ "$attempt" != 3 ] || break
        [ "$fetched" -ge "${PUTGD_APT_PROGRESS_KB:-131072}" ] || putgd_demote_mirror
        # A stopped attempt can leave dpkg half done; apt-get refuses to install until it is finished.
        timeout --kill-after=30s 120 dpkg --configure -a || true
      done
      return 1
    }

jobs:
  native:
    name: native (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    # Normally 8-17 minutes. Above four stopped install attempts plus the snapshot fallback (#467).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu24.04
            format: DEB
            image: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
            kde: ''
            # File-manager menu plugins (#1105), required in each package.
            plugins: -DPUTGD_NAUTILUS_PLUGIN=ON -DPUTGD_CAJA_PLUGIN=ON -DPUTGD_PEONY_PLUGIN=ON
          - name: ubuntu26.04
            format: DEB
            image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
            kde: --require-kde
            plugins: -DPUTGD_NAUTILUS_PLUGIN=ON -DPUTGD_CAJA_PLUGIN=ON -DPUTGD_PEONY_PLUGIN=ON
          - name: debian13
            format: DEB
            image: debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
            kde: --require-kde
            plugins: -DPUTGD_NAUTILUS_PLUGIN=ON -DPUTGD_CAJA_PLUGIN=ON -DPUTGD_PEONY_PLUGIN=ON
          - name: fedora44
            format: RPM
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            kde: --require-kde
            # Fedora has no Peony.
            plugins: -DPUTGD_NAUTILUS_PLUGIN=ON -DPUTGD_CAJA_PLUGIN=ON -DPUTGD_PEONY_PLUGIN=OFF
    steps:
      - name: Bootstrap checkout tools
        # tools/ci/install-packages.sh is not checked out yet: the same bounded retry, inline (#368),
        # each attempt stopped after 10 minutes (#467).
        shell: bash
        run: |
          apt=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          eval "$PUTGD_UBUNTU_MIRRORS"
          bounded() { timeout --kill-after=30s 10m "$@"; }
          # actions/cache needs zstd to write what the AppImage job, outside any container, can restore.
          zstd=$([ '${{ matrix.name }}' != ubuntu24.04 ] || echo zstd)
          for attempt in 1 2 3; do
            if command -v apt-get >/dev/null; then
              bounded apt-get update --error-on=any "${apt[@]}" && bounded apt-get install -y "${apt[@]}" git ca-certificates $zstd && exit 0
            else
              bounded dnf install -y --setopt=retries=10 --setopt=timeout=60 --setopt=minrate=1000 $([ "$attempt" = 1 ] || echo --refresh) git ca-certificates && exit 0
            fi
            echo "::warning::Package install (bootstrap): attempt $attempt of 3 failed"
            putgd_demote_mirror
            [ "$attempt" != 1 ] || printf '### Package install retries (native (%s) bootstrap)\n\n| Attempt | Outcome |\n| --- | --- |\n' '${{ matrix.name }}' >> "$GITHUB_STEP_SUMMARY"
            echo "| $attempt of 3 | failed |" >> "$GITHUB_STEP_SUMMARY"
            [ "$attempt" = 3 ] || sleep $((attempt * 30))
          done
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Identify the package snapshot
        # Downloaded packages and their metadata, refreshed weekly: installs reuse them, and
        # when every mirror attempt fails the install runs offline from them (#368).
        id: pkg-key
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pkg-cache
        with:
          path: /var/cache/putgd-packages
          key: putgd-pkgs-v1-${{ matrix.name }}-${{ hashFiles('tools/releases/install-native-deps.sh', 'tools/ci/install-packages.sh') }}-${{ steps.pkg-key.outputs.week }}
          restore-keys: putgd-pkgs-v1-${{ matrix.name }}-${{ hashFiles('tools/releases/install-native-deps.sh', 'tools/ci/install-packages.sh') }}-
      - name: Standard distro dependencies
        env:
          PUTGD_PKG_CACHE: /var/cache/putgd-packages
          PUTGD_PKG_LABEL: native (${{ matrix.name }})
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/releases/install-native-deps.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Only a snapshot an online install just refreshed, never one it fell back to.
        if: env.PUTGD_PKG_CACHE_REFRESHED == 'true' && steps.pkg-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          path: /var/cache/putgd-packages
          key: ${{ steps.pkg-cache.outputs.cache-primary-key }}
      - name: Validate exact release source
        if: inputs.release_tag != ''
        run: python3 tools/releases/verify_tag.py --tag "$RELEASE_TAG"
      - name: Identify release dependency environment
        id: sdk-key
        run: python3 tools/ci/sdk_cache.py key
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sdk-cache
        with:
          path: |
            build/sdk
            build/sdk-cache.json
          key: ${{ steps.sdk-key.outputs.key }}
      - name: Verify pinned SDK source
        # Packages ship the SDK licenses and the source export rebuilds against this tree.
        timeout-minutes: 20
        run: bash tools/ci/sdk-source.sh
      - name: Verify restored prefix
        if: steps.sdk-cache.outputs.cache-hit == 'true'
        run: python3 tools/ci/sdk_cache.py verify --key '${{ steps.sdk-key.outputs.key }}'
      - name: Build official SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          PUTGD_SDK_JOBS="$(nproc)" bash tools/releases/provision-sdk.sh
          python3 tools/ci/sdk_cache.py seal --key '${{ steps.sdk-key.outputs.key }}'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.sdk-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          path: |
            build/sdk
            build/sdk-cache.json
          key: ${{ steps.sdk-key.outputs.key }}
      - name: Provision pinned Proton helper
        timeout-minutes: 15
        env:
          # npm's own per-request retries for registry errors (#368); #332's exit 152 is a CPU-time kill, not this.
          npm_config_fetch_retries: '5'
        run: python3 tools/proton/provision_runtime.py
      - name: Restore release compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache-package
          key: ccache-package-${{ matrix.name }}-${{ steps.sdk-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-package-${{ matrix.name }}-${{ steps.sdk-key.outputs.key }}-
      - name: Build production release and audit native package
        env:
          FORMAT: ${{ matrix.format }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          KDE_REQUIREMENT: ${{ matrix.kde }}
          FILE_MANAGER_PLUGINS: ${{ matrix.plugins }}
          # The update check offers this package's own download (#293).
          PACKAGE_TARGET: ${{ matrix.name }}
        run: |
          ccache --zero-stats
          cmake --preset release -DPUTGD_OCR=ON -DBUILD_TESTING=OFF -DPUTGD_LAB_FIXTURE=OFF -DPUTGD_PHYSICAL_BENCHMARKS=OFF -DPUTGD_RELEASE_TAG="$RELEASE_TAG" -DPUTGD_BUNDLE_PROTON=ON -DCMAKE_INSTALL_PREFIX=/usr -DPUTGD_PACKAGE_TARGET="$PACKAGE_TARGET" $FILE_MANAGER_PLUGINS
          cmake --build --preset release --parallel "$(nproc)"
          python3 tools/releases/native.py --build build/release --format "$FORMAT" --output "$PWD/build/release-packages" --proton-manifest build/dependencies/proton-runtime/manifest.json --require-proton $KDE_REQUIREMENT --package-target "$PACKAGE_TARGET"
          ccache --show-stats
      - name: Save release compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/nightly'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache-package
          key: ccache-package-${{ matrix.name }}-${{ steps.sdk-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stage split debug symbols by build ID
        # Each packaged binary's .debug file, checked against the package's build IDs (#124).
        env:
          LABEL: ${{ matrix.name }}
        run: python3 tools/releases/debug_symbols.py stage --build build/release --installed build/release-packages/extracted --label "$LABEL" --output build/debug-symbols
      - name: Export exact application source
        if: matrix.name == 'ubuntu24.04'
        run: |
          python3 tools/releases/source_archive.py --root "$PWD" --identity build/release/build-identity/build-info.json --output-dir build/source-export
      - name: Check the source export holds every build input
        # A second full compile on every pull request found nothing the file check misses.
        # Nightly pushes, pull requests to main and stable tags still compile it below.
        if: matrix.name == 'ubuntu24.04' && github.event_name == 'pull_request' && github.base_ref != 'main'
        run: python3 tools/releases/check_source_build.py --inputs-of build/release --receipt build/source-export/source-archive.json --sdk-prefix "$PWD/build/sdk" --sdk-source "$PWD/build/dependencies/aws-sdk-cpp" --output build/source-input-check --bundle-proton --proton-source "$PWD/build/dependencies/proton-runtime/sdk-source" --proton-crypto-source "$PWD/build/dependencies/proton-runtime/crypto-source" --proton-offline
      - name: Restore source-export compiler cache
        if: matrix.name == 'ubuntu24.04' && (github.event_name != 'pull_request' || github.base_ref == 'main') && (inputs.release_tag == '' || !endsWith(inputs.release_tag, '-nightly'))
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache-source-export
          key: ccache-source-export-${{ steps.sdk-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-source-export-${{ steps.sdk-key.outputs.key }}-
      - name: Compile the source export on development and stable builds
        id: source-compile
        if: matrix.name == 'ubuntu24.04' && (github.event_name != 'pull_request' || github.base_ref == 'main') && (inputs.release_tag == '' || !endsWith(inputs.release_tag, '-nightly'))
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # The export's directory is named after the build's version, so it changes
          # every commit; its debug information is discarded with the build.
          CCACHE_NOHASHDIR: 'true'
        # ccache still hashes each exported source and header, so one the compile needs
        # that is missing from the export fails here. Every program is really linked and run.
        run: |
          export CCACHE_DIR="$PWD/build/ccache-source-export"
          ccache --zero-stats
          python3 tools/releases/check_source_build.py --receipt build/source-export/source-archive.json --sdk-prefix "$PWD/build/sdk" --sdk-source "$PWD/build/dependencies/aws-sdk-cpp" --output build/source-build --bundle-proton --proton-source "$PWD/build/dependencies/proton-runtime/sdk-source" --proton-crypto-source "$PWD/build/dependencies/proton-runtime/crypto-source" --proton-offline
          ccache --show-stats
      - name: Save source-export compiler cache
        # Also when a newer push cancels the compile, or busy days never fill this cache.
        if: always() && (steps.source-compile.outcome == 'success' || steps.source-compile.outcome == 'cancelled') && matrix.name == 'ubuntu24.04' && inputs.release_tag == '' && github.event_name == 'push' && github.ref == 'refs/heads/nightly'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache-source-export
          key: ccache-source-export-${{ steps.sdk-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-${{ matrix.name }}
          path: build/debug-symbols/
          compression-level: 1
          if-no-files-found: error
          retention-days: 90
      - name: Stage flat native artifact evidence
        if: always()
        run: python3 tools/releases/stage_artifacts.py --kind native --packages-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-native-${{ matrix.name }}
          path: build/release-artifact/
          compression-level: 0
          if-no-files-found: warn
          retention-days: 30

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base@sha256:823e937464d1528b306a8e1137ef406b9c56e5fee43c7a19e93684d554af74e1
    timeout-minutes: 90
    steps:
      - name: Bootstrap checkout
        run: pacman -Syu --noconfirm --needed git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Restore release compiler cache
        # Restored before the build user takes ownership of the workspace.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache-package
          key: ccache-package-archlinux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-package-archlinux-
      - name: Distro dependencies and build user
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/releases/install-native-deps.sh
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
      - name: Build verified dependencies and production package
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Holds the SDK's objects as well as the application's.
          CCACHE_MAXSIZE: 384M
        run: runuser -u builder -- bash tools/releases/build-arch.sh
      - name: Save release compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/nightly'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache-package
          key: ccache-package-archlinux-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stage flat native evidence
        if: always()
        run: python tools/releases/stage_artifacts.py --kind native --packages-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-native-archlinux
          path: build/release-artifact/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-archlinux
          path: build/debug-symbols/
          if-no-files-found: error

  arch-install:
    needs: arch
    runs-on: ubuntu-24.04
    container: archlinux:base@sha256:823e937464d1528b306a8e1137ef406b9c56e5fee43c7a19e93684d554af74e1
    timeout-minutes: 15
    steps:
      - run: pacman -Syu --noconfirm --needed git ca-certificates python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-native-archlinux
          path: build/arch-artifact
      - name: Install exact CI artifact, start resident, and uninstall
        run: bash tools/releases/smoke-arch.sh build/arch-artifact/*.pkg.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arch-install-evidence
          path: build/arch-smoke/
          if-no-files-found: warn

  appimage:
    runs-on: ubuntu-24.04
    # Package attempts are bounded and bypass the hosted runner's slow Azure mirror (#500).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Use official Ubuntu archive mirrors
        # Keep signed distro metadata and archive/security failover without adding
        # a ~650-package snapshot to the repository's shared 10 GB cache (#500).
        run: sudo python3 tools/ci/hosted_apt_mirrors.py
      - name: Identify the package snapshot
        id: pkg-key
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # The same Ubuntu 24.04 packages native (ubuntu24.04) already caches, so this
      # avoids a 2.5-minute download without using more of the shared cache budget.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/putgd-packages
          key: putgd-pkgs-v1-ubuntu24.04-${{ hashFiles('tools/releases/install-native-deps.sh', 'tools/ci/install-packages.sh') }}-${{ steps.pkg-key.outputs.week }}
          restore-keys: putgd-pkgs-v1-ubuntu24.04-${{ hashFiles('tools/releases/install-native-deps.sh', 'tools/ci/install-packages.sh') }}-
      - name: Standard build dependencies
        env:
          PUTGD_PKG_LABEL: appimage
          PUTGD_PKG_TIMEOUT: '300'
          PUTGD_PKG_STALL: '120'
          PUTGD_PKG_ATTEMPTS: '3'
        run: |
          # Retried package installs (#368); sudo keeps the summary file for the retry report.
          pkg_install() { sudo --preserve-env=GITHUB_STEP_SUMMARY,PUTGD_PKG_LABEL,PUTGD_PKG_TIMEOUT,PUTGD_PKG_STALL,PUTGD_PKG_ATTEMPTS bash tools/ci/install-packages.sh "$@"; }
          # actions/cache stores this path relative to the container's shallower workspace,
          # so here it restores three levels above this workspace, not to /var/cache.
          PUTGD_PKG_CACHE=$(realpath -m "$GITHUB_WORKSPACE/../../../var/cache/putgd-packages")
          export PUTGD_PKG_CACHE
          sudo --preserve-env=GITHUB_STEP_SUMMARY,PUTGD_PKG_CACHE,PUTGD_PKG_LABEL,PUTGD_PKG_TIMEOUT,PUTGD_PKG_STALL,PUTGD_PKG_ATTEMPTS bash tools/releases/install-native-deps.sh
          # patchelf and the bundled libraries, then screen recording: the pinned FFmpeg's build inputs and the GStreamer plugins the image bundles.
          pkg_install patchelf libgtk-3-dev libsecret-1-dev qt6-base-private-dev libx11-xcb-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-render-util0-dev libxcb-sync-dev \
            nasm libva-dev libvpx-dev libwebp-dev libopus-dev libffmpeg-nvenc-dev libx264-dev libx265-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-pipewire gstreamer1.0-pulseaudio gstreamer1.0-vaapi
      - name: The locked Qt version
        # Renovate updates it in the lock (#420), where the AppImage tools read it too.
        id: qt
        run: echo "version=$(python3 -c 'import json; print(json.load(open("packaging/appimage/tools.lock.json"))["buildInputs"]["qt"])')" >> "$GITHUB_OUTPUT"
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        env:
          LOG_CFG: ${{ github.workspace }}/tools/ci/aqt-logging.ini
        with:
          version: ${{ steps.qt.outputs.version }}
          arch: linux_gcc_64
          modules: qtimageformats
          cache: true
      - name: Validate exact release source
        if: inputs.release_tag != ''
        run: python3 tools/releases/verify_tag.py --tag "$RELEASE_TAG"
      - name: Verify pinned SDK source
        timeout-minutes: 20
        run: bash tools/ci/sdk-source.sh
      - name: Identify AppImage dependency environment
        id: sdk-key
        run: python3 tools/ci/sdk_cache.py key --contract tools/releases/provision-appimage.py --contract packaging/appimage/tools.lock.json --contract packaging/appimage/media.json
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sdk-cache
        with:
          path: |
            build/sdk
            build/sdk-cache.json
            build/appimage-deps
            build/appimage-deps-cache.json
          key: ${{ steps.sdk-key.outputs.key }}
      - name: Verify restored AppImage dependencies and fresh notices
        if: steps.sdk-cache.outputs.cache-hit == 'true'
        run: |
          python3 tools/ci/sdk_cache.py verify --key '${{ steps.sdk-key.outputs.key }}'
          python3 tools/ci/sdk_cache.py verify --prefix build/appimage-deps --manifest build/appimage-deps-cache.json --key '${{ steps.sdk-key.outputs.key }}'
          python3 tools/releases/provision-appimage.py --qt-root "$QT_ROOT_DIR" --skip-build
      - name: Standard upstream dependency builds
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          PUTGD_SDK_JOBS="$(nproc)" bash tools/releases/provision-sdk.sh
          python3 tools/releases/provision-appimage.py --qt-root "$QT_ROOT_DIR"
          python3 tools/ci/sdk_cache.py seal --key '${{ steps.sdk-key.outputs.key }}'
          python3 tools/ci/sdk_cache.py seal --prefix build/appimage-deps --manifest build/appimage-deps-cache.json --key '${{ steps.sdk-key.outputs.key }}'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.sdk-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          path: |
            build/sdk
            build/sdk-cache.json
            build/appimage-deps
            build/appimage-deps-cache.json
          key: ${{ steps.sdk-key.outputs.key }}
      - name: Provision pinned Proton helper
        timeout-minutes: 15
        env:
          # npm's own per-request retries for registry errors (#368); #332's exit 152 is a CPU-time kill, not this.
          npm_config_fetch_retries: '5'
        run: python3 tools/proton/provision_runtime.py
      - name: Headless Wayland compositor for the image's start check
        run: sudo --preserve-env=GITHUB_STEP_SUMMARY bash tools/ci/install-packages.sh --no-install-recommends weston
      - name: Restore release compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache-package
          key: ccache-package-appimage-${{ steps.sdk-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-package-appimage-${{ steps.sdk-key.outputs.key }}-
      - name: Build and audit AppImage
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ccache --zero-stats
          PUTGD_APPIMAGE_SOURCES=0 PUTGD_BUILD_JOBS="$(nproc)" bash tools/releases/build-appimage.sh
          ccache --show-stats
      - name: Save release compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/nightly'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache-package
          key: ccache-package-appimage-${{ steps.sdk-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stage split debug symbols by build ID
        run: python3 tools/releases/debug_symbols.py stage --build build/release --installed build/appimage-stage --label appimage --output build/debug-symbols
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-appimage
          path: build/debug-symbols/
          compression-level: 1
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-source-receipt
          path: build/appimage-output/appimage-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Stage flat AppImage artifact evidence
        if: always()
        run: python3 tools/releases/stage_artifacts.py --kind appimage --packages-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-appimage
          path: build/release-artifact/
          compression-level: 0
          if-no-files-found: warn
          retention-days: 30

  appimage-sources:
    # Corresponding source is required, but independent of image smoke tests/SBOMs.
    needs: appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage-source-receipt
          path: build/appimage-output
      - name: Signed Ubuntu source indexes
        env:
          PUTGD_PKG_TIMEOUT: '300'
          PUTGD_PKG_STALL: '120'
          PUTGD_PKG_ATTEMPTS: '3'
        run: |
          sudo python3 tools/ci/hosted_apt_mirrors.py
          # The AppImage's GPL corresponding source includes the bundled distro source packages.
          printf 'Types: deb-src\nURIs: http://archive.ubuntu.com/ubuntu/\nSuites: noble noble-updates noble-security\nComponents: main restricted universe multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/putgd-appimage-src.sources > /dev/null
          sudo --preserve-env=GITHUB_STEP_SUMMARY,PUTGD_PKG_TIMEOUT,PUTGD_PKG_STALL,PUTGD_PKG_ATTEMPTS bash tools/ci/install-packages.sh
      - name: Key distro source downloads by the bundled Ubuntu packages
        id: source-key
        run: |
          # Keep the assignment separate: a failing command inside echo's $() would not fail the step.
          key=$(python3 tools/releases/appimage_complete_sources.py --receipt build/appimage-output/appimage-build.json --print-cache-key)
          echo "value=$key" >> "$GITHUB_OUTPUT"
      - name: Restore authenticated distro source downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: source-cache
        with:
          path: build/dependencies/appimage-complete-source/ubuntu
          key: appimage-distro-sources-v1-${{ steps.source-key.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Each package version has its own directory, checked against its .dsc, so an older
          # tree only saves downloads: anything it lacks is fetched, anything extra is dropped.
          restore-keys: |
            appimage-distro-sources-v1-${{ steps.source-key.outputs.value }}-
            appimage-distro-sources-v1-
      - name: Collect exact bundled-component sources
        run: |
          python3 tools/releases/appimage_complete_sources.py --receipt build/appimage-output/appimage-build.json \
            --output-dir build/appimage-output --timestamp "$(git show -s --format=%ct HEAD)"
      - name: Save authenticated distro source downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/nightly'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dependencies/appimage-complete-source/ubuntu
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-sources
          path: |
            build/appimage-output/appimage-complete-source.json
            build/appimage-output/*-appimage-complete-source.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  appimage-pipewire:
    # Run against the exact new image while SBOM/source collection proceeds.
    needs: appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-appimage
          path: build/pipewire
      - name: Extract the AppImage
        run: |
          image=$(find "$PWD/build/pipewire" -maxdepth 1 -name '*-x86_64.AppImage' | head -n 1)
          test -n "$image"
          chmod +x "$image"
          (cd build/pipewire && "$image" --appimage-extract > /dev/null)
      - name: Link pipewiresrc on Ubuntu 26.04's PipeWire
        run: |
          docker run --rm --env PUTGD_UBUNTU_MIRRORS --volume "$PWD:/src:ro" --workdir /src \
            ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7 \
            bash tests/desktop/pipewire/ci_check.sh --install build/pipewire/squashfs-root

  sbom:
    # CycloneDX SBOMs of every package and their Grype report (#420, docs/release/release.md).
    # packaging/sbom/policy.json decides which findings flag and which block this channel.
    needs: [native, arch, arch-install, appimage]
    runs-on: ubuntu-24.04
    # Normally 3 minutes, most of it importing the Grype database.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'release-{native-*,appimage}'
          path: build/downloaded
      - name: RPM extraction tools
        run: sudo --preserve-env=GITHUB_STEP_SUMMARY bash tools/ci/install-packages.sh --no-install-recommends rpm2cpio cpio
      - name: Pinned Syft and Grype
        run: python3 tools/releases/sbom.py tools --output "$RUNNER_TEMP/sbom-tools"
      - name: Identify the current Grype database
        id: grype-db
        run: |
          python3 tools/releases/sbom.py database --listing-only --listing build/grype-db.json --output build/grype-db
          echo "key=grype-db-v6-$(python3 -c 'import json; print(json.load(open("build/grype-db.json"))["sha256"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: grype-cache
        with:
          path: build/grype-db
          key: ${{ steps.grype-db.outputs.key }}
      - name: Download, verify and import the Grype database
        env:
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          python3 tools/releases/sbom.py database --listing build/grype-db.json --output build/grype-db
          "$RUNNER_TEMP/sbom-tools/grype" db import build/grype-db/vulnerability-db_*.tar.zst
          "$RUNNER_TEMP/sbom-tools/grype" db status
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.grype-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          path: build/grype-db
          key: ${{ steps.grype-db.outputs.key }}
      - name: Generate the packages' SBOMs
        run: |
          python3 tools/releases/sbom.py generate --inputs build/downloaded --syft "$RUNNER_TEMP/sbom-tools/syft" \
            --output build/release-sbom --timestamp "$(git show -s --format=%ct HEAD)"
      - name: Scan the SBOMs and apply the vulnerability policy
        env:
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: |
          python3 tools/releases/sbom.py scan --sboms build/release-sbom --grype "$RUNNER_TEMP/sbom-tools/grype" \
            --output build/vulnerabilities --database build/grype-db.json --release-tag "$RELEASE_TAG" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: build/release-sbom/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vulnerability-report
          path: build/vulnerabilities/
          if-no-files-found: warn
          retention-days: 90

  collect:
    if: inputs.release_tag != ''
    needs: [native, arch, arch-install, appimage, appimage-sources, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'release-{native-*,appimage,sbom}'
          path: build/downloaded
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage-sources
          path: build/downloaded/release-appimage
      - name: Verify and collect exact release assets
        run: python3 tools/releases/collect.py --tag "$RELEASE_TAG" --inputs build/downloaded --output build/publish --installers-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            build/publish/*
            !build/publish/sources/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source-assets
          path: build/publish/sources/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
