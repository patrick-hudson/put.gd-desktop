<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="put.gd desktop — capture, upload, link copied">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d13"/>
      <stop offset="1" stop-color="#171c27"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9bbcff" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#9bbcff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="0.45" stop-color="#f4f6fb"/>
      <stop offset="0.5" stop-color="#9bbcff"/>
      <stop offset="0.55" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#f4f6fb"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
    <filter id="tileglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feFlood flood-color="#9bbcff" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="190" cy="160" rx="230" ry="170" fill="url(#glow)">
      <animate attributeName="rx" values="210;250;210" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="160;190;160" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M0 296 C300 236 620 336 1200 256 V320 H0Z" fill="#9bbcff" fill-opacity="0.07"/>
    <g opacity="0.05" transform="translate(905 10) scale(12.5)">
      <path fill="#ffffff" d="M2 13H6V18Q6 19 7 19H17Q18 19 18 18V13H22V18Q22 23 17 23H7Q2 23 2 18Z"/>
      <path fill="#ffffff" d="M12 2L20 10H15V16H9V10H4Z"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#2a3140"/>

  <g transform="translate(88 64)">
    <rect width="192" height="192" rx="42" fill="#1b1e25" stroke="#2f3747" filter="url(#tileglow)"/>
    <g transform="translate(19.2 16) scale(6.4)">
      <path fill="#526386" d="M2 13H6V18Q6 19 7 19H17Q18 19 18 18V13H22V18Q22 23 17 23H7Q2 23 2 18Z"/>
      <path fill="#9bbcff" d="M12 2L20 10H15V16H9V10H4Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.9;0 0" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
      </path>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="326" y="152" font-size="96" font-weight="800" fill="url(#shine)" letter-spacing="-3">put.gd</text>
    <text x="660" y="152" font-size="30" font-weight="500" fill="#526386" letter-spacing="2">DESKTOP</text>
    <text x="330" y="202" font-size="28" font-weight="500" fill="#aab4c8">Capture. Upload. Link copied.</text>
    <g transform="translate(330 232)" font-size="15" font-weight="600" fill="#c9d3e6">
      <rect width="118" height="32" rx="16" fill="#151a24" stroke="#2f3747"/><text x="59" y="21" text-anchor="middle">Linux desktop</text>
      <rect x="130" width="112" height="32" rx="16" fill="#151a24" stroke="#2f3747"/><text x="186" y="21" text-anchor="middle">Qt 6 · C++20</text>
      <rect x="254" width="180" height="32" rx="16" fill="#151a24" stroke="#2f3747"/><text x="344" y="21" text-anchor="middle">S3 · R2 · B2 · Proton</text>
      <rect x="446" width="124" height="32" rx="16" fill="#151a24" stroke="#2f3747"/><text x="508" y="21" text-anchor="middle">CLI · MCP ready</text>
      <rect x="582" width="138" height="32" rx="16" fill="#1a2436" stroke="#3b5484"/><text x="651" y="21" text-anchor="middle" fill="#9bbcff">Nightlies daily</text>
    </g>
  </g>
</svg>
