<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-9QGypk7ij/4wkG40yLU7hbKt1BE1LopQcBq+q2MQLo4='; style-src 'sha256-MYtx15lOvZWkh7YAlUVEHZ+x3tveNgkDhh6EC+CTOdM='; img-src blob:; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sealed link</title>
<style>
:root{color-scheme:dark light;--bg:#1d1e20;--fg:#e8e6e1;--dim:#a19f99;--line:#3a3b3e;--accent:#e0b44a;--bad:#ff8a7a}
@media (prefers-color-scheme:light){:root{--bg:#f6f5f2;--fg:#222326;--dim:#5f5e5a;--line:#d6d4cf;--accent:#8a6410;--bad:#b3261e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
h1{font-size:16px;margin:0;font-weight:600;overflow-wrap:anywhere}
#size{color:var(--dim);font-size:13px}
#status{color:var(--dim);margin:24px 0}
#status.bad{color:var(--bad)}
form{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
input{flex:1 1 220px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);font:inherit}
button,a.button{padding:8px 14px;border:1px solid var(--accent);border-radius:6px;background:transparent;color:var(--accent);font:inherit;cursor:pointer;text-decoration:none}
#view{display:flex;justify-content:center}
#view img{max-width:100%;max-height:80vh;cursor:zoom-in;image-rendering:auto}
#view.actual{overflow:auto;justify-content:flex-start}
#view.actual img{max-width:none;max-height:none;cursor:zoom-out}
#view video,#view audio{max-width:100%;max-height:80vh}
#view pre{width:100%;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:13px/1.5 ui-monospace,monospace}
footer{color:var(--dim);font-size:12px;margin-top:24px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1 id="name">Sealed link</h1><span id="size"></span><a id="save" class="button" hidden>Download</a></header>
<p id="status">Opening…</p>
<form id="ask" hidden><input id="pass" type="password" autocomplete="off" aria-label="Passphrase" placeholder="Passphrase"><button>Open</button></form>
<div id="view"></div>
<footer>Sealed with put.gd. The file was decrypted in this browser.</footer>
</main>
<!--putgd-sealed-->
<script>
"use strict";
(()=>{
const $=id=>document.getElementById(id),te=new TextEncoder(),S=crypto.subtle,HB=96,TAG=16;
// The format's limits: a page holds at most 64 MiB of file, a data file at most 2 GiB.
const INLINE_MAX=67120000,SPLIT_MAX=2147525000,FILE_MAX=2147483648;
const say=(text,bad)=>{const s=$("status");s.textContent=text;s.className=bad?"bad":"";s.hidden=false};
const fail=e=>say(e&&e.user?e.message:"This link is incomplete or damaged.",true);
const err=m=>{const e=new Error(m);e.user=true;return e};
const be32=(b,o)=>((b[o]<<24)>>>0)+(b[o+1]<<16)+(b[o+2]<<8)+b[o+3];
const units=n=>{const u=["bytes","KB","MB","GB"];let i=0;while(n>=1024&&i<3){n/=1024;i++}return (i?n.toFixed(1):n)+" "+u[i]};
const cat=(a,b)=>{const c=new Uint8Array(a.length+b.length);c.set(a);c.set(b,a.length);return c};
const pos=(i,last)=>{const p=new Uint8Array(5);new DataView(p.buffer).setUint32(0,i);p[4]=last?1:0;return p};
const hkdf=async(ikm,salt,info)=>new Uint8Array(await S.deriveBits({name:"HKDF",hash:"SHA-256",salt,info:te.encode(info)},await S.importKey("raw",ikm,"HKDF",false,["deriveBits"]),256));
const keyText=location.hash.slice(1);
function linkKey(){
 if(!/^v1\.[A-Za-z0-9_-]{43}$/.test(keyText))throw err("This link is missing its key. Ask for the full link, including everything after #.");
 const b=atob(keyText.slice(3).replace(/-/g,"+").replace(/_/g,"/")+"=");
 // Only the canonical form is a key: the last character's 4 unused bits are zero.
 if(btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")!==keyText.slice(3))throw err("This link is missing its key. Ask for the full link, including everything after #.");
 return Uint8Array.from(b,c=>c.charCodeAt(0));
}
function header(h){
 const m="PGDSEAL1";for(let i=0;i<8;i++)if(h[i]!==m.charCodeAt(i))throw err("This isn't a sealed link.");
 if(h[8]!==1)throw err("This sealed link needs a newer viewer.");
 if(h[9]>1||h[10]||h[11]||be32(h,12)!==1048576)throw 0;
 const it=be32(h,16),pass=h[9]===1;
 // Version 1 fixes the passphrase cost at 600,000 iterations.
 if(pass?it!==600000:it!==0)throw 0;
 for(let i=59;i<64;i++)if(h[i])throw 0;
 return {bytes:h.slice(0,HB),pass,it,salt:h.slice(20,52),prefix:h.slice(52,59),chunk:1048576};
}
async function checkKey(hd,k){
 const ck=await S.importKey("raw",await hkdf(k,hd.salt,"put.gd sealed v1 check"),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
 if(!await S.verify("HMAC",ck,hd.bytes.slice(64,96),hd.bytes.slice(0,64)))throw 0;
}
function ask(note){
 return new Promise(done=>{const f=$("ask"),p=$("pass");f.hidden=false;say(note||"This link needs its passphrase.",!!note);p.focus();
  f.onsubmit=e=>{e.preventDefault();if(!p.value)return;f.hidden=true;const v=p.value;p.value="";done(v)}});
}
async function fileKey(hd,k,pass){
 let ikm=k;
 if(hd.pass){say("Checking the passphrase…");
  const pk=await S.importKey("raw",te.encode(pass.normalize("NFC")),"PBKDF2",false,["deriveBits"]);
  ikm=cat(k,new Uint8Array(await S.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:hd.salt,iterations:hd.it},pk,256)))}
 return S.importKey("raw",await hkdf(ikm,hd.salt,"put.gd sealed v1 payload"),"AES-GCM",false,["decrypt"]);
}
function decryptor(hd,key){
 let index=0,metaLen=-1,meta=null,buf=new Uint8Array(0),got=0;const parts=[];
 return {parts,get meta(){return meta},got:()=>got,
  async chunk(c,last){
   const p=pos(index,last);let plain;
   try{plain=new Uint8Array(await S.decrypt({name:"AES-GCM",iv:cat(hd.prefix,p),additionalData:cat(hd.bytes,p),tagLength:128},key,c))}
   catch(e){throw index===0&&hd.pass?err("That passphrase doesn't open this link."):0}
   index++;
   if(!meta){buf=cat(buf,plain);if(metaLen<0&&buf.length>=4){metaLen=be32(buf,0);if(metaLen>4096)throw 0}
    if(metaLen<0||buf.length<4+metaLen){if(last)throw 0;return}
    meta=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(buf.subarray(4,4+metaLen)));
    if(typeof meta.name!=="string"||typeof meta.type!=="string"||!Number.isInteger(meta.size)||meta.size<0||meta.size>FILE_MAX)throw 0;
    plain=buf.subarray(4+metaLen);buf=null;show(meta)}
   if(plain.length){parts.push(plain);got+=plain.length}
   if(last&&got!==meta.size)throw 0;
  }};
}
function show(meta){
 $("name").textContent=meta.name||"Sealed file";$("size").textContent=units(meta.size);document.title=meta.name||"Sealed link";
}
const IMG=["image/png","image/jpeg","image/gif","image/webp","image/avif","image/bmp","image/svg+xml"];
const VID=["video/mp4","video/webm","video/ogg","video/quicktime"],AUD=["audio/mpeg","audio/ogg","audio/wav","audio/webm","audio/mp4","audio/flac"];
function render(d){
 const meta=d.meta,type=String(meta.type).toLowerCase().split(";")[0].trim();
 const shown=IMG.includes(type)||VID.includes(type)||AUD.includes(type);
 // Anything that isn't shown downloads as plain bytes: HTML and the like never render as a page.
 const blob=new Blob(d.parts,{type:shown?type:"application/octet-stream"}),url=URL.createObjectURL(blob),v=$("view");
 const a=$("save");a.href=url;a.download=(meta.name||"sealed-file").replace(/[\/\\\u0000-\u001f\u007f]/g,"_").slice(0,200)||"sealed-file";a.hidden=false;
 $("status").hidden=true;
 if(IMG.includes(type)){const i=new Image();i.alt=meta.name;i.src=url;i.onclick=()=>v.classList.toggle("actual");i.onerror=()=>say("This browser can't show this image. Select Download to save it.");v.append(i)}
 else if(VID.includes(type)||AUD.includes(type)){const m=document.createElement(VID.includes(type)?"video":"audio");m.controls=true;m.src=url;m.onerror=()=>say("This browser can't play this file. Select Download to save it.");v.append(m)}
 else if(type==="text/plain"&&meta.size<=4194304){blob.text().then(t=>{const p=document.createElement("pre");p.textContent=t;v.append(p)})}
 else say("Select Download to save this file.");
 document.documentElement.dataset.state="open";
}
async function inline(el){
 const t=el.textContent,n=Math.floor(t.length/4)*3-(t.endsWith("==")?2:t.endsWith("=")?1:0);
 if(t.length%4||n<HB+TAG+1||n>INLINE_MAX)throw 0;
 const out=new Uint8Array(n);let o=0;
 for(let i=0;i<t.length;i+=4194304){const b=atob(t.slice(i,i+4194304));for(let j=0;j<b.length;j++)out[o++]=b.charCodeAt(j)}
 return out;
}
async function run(){
 const el=$("putgd-sealed");if(!el)throw err("This isn't a sealed link.");
 // Browsers decrypt only on secure pages (https, or this computer).
 if(!S)throw err("This browser decrypts only on secure pages. Ask for an https link.");
 const k=linkKey(),split=el.dataset.form==="split";
 let stream=null,data=null,total=0,first;
 if(split){
  const bin=el.dataset.bin||"";if(!/^[A-Za-z0-9_-]{1,128}\.bin$/.test(bin))throw 0;
  say("Downloading…");
  let r;try{r=await fetch("./"+bin,{credentials:"omit",redirect:"error",cache:"no-store"})}catch(e){throw err("Couldn't download the sealed file. Check your connection and reload.")}
  if(!r.ok||!r.body)throw err("The sealed file isn't at this address any more.");
  total=Number(r.headers.get("Content-Length"))||0;stream=r.body.getReader();
 }else{data=await inline(el);el.remove()}
 let pending=new Uint8Array(0),done=false,read=0;
 const pull=async need=>{while(!done&&pending.length<need){const x=await stream.read();if(x.done)done=true;else{pending=cat(pending,x.value);read+=x.value.length;if(read>SPLIT_MAX){stream.cancel();throw 0}}}};
 if(split){await pull(HB);first=pending.slice(0,HB);pending=pending.slice(HB)}else first=data.subarray(0,HB);
 if(first.length<HB)throw 0;
 const hd=header(first);await checkKey(hd,k);
 let key,note="";
 for(;;){const pass=hd.pass?await ask(note):"";
  try{key=await fileKey(hd,k,pass);const d=decryptor(hd,key),full=hd.chunk+TAG;
   say("Decrypting…");
   if(split){
    for(;;){await pull(full+1);
     if(pending.length>full){await d.chunk(pending.slice(0,full),false);pending=pending.slice(full)}
     else{if(pending.length<TAG+1)throw 0;await d.chunk(pending,true);break}
     if(total)say("Decrypting… "+Math.min(99,Math.floor(read*100/total))+"%")}
   }else{
    const body=data.length-HB,chunks=Math.ceil(body/full);if(body-(chunks-1)*full<TAG+1)throw 0;
    for(let i=0;i<chunks;i++){const s=HB+i*full;await d.chunk(data.subarray(s,Math.min(s+full,data.length)),i===chunks-1)}
    data=null}
   render(d);return;
  }catch(e){if(e&&e.user&&hd.pass&&e.message.startsWith("That passphrase")){note=e.message;continue}throw e}
 }
}
run().catch(e=>{fail(e);document.documentElement.dataset.state="failed"});
})();
</script>
</body>
</html>
